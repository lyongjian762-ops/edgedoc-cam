name: Sprint 0 acceptance report
description: Summarize evidence and decide whether Sprint 1 can start.
title: "Sprint 0: publish acceptance report"
body:
  - type: textarea
    id: report
    attributes:
      label: Evidence, results, and open items
      description: Link the four prerequisite issues and summarize verified results.
    validations:
      required: true
  - type: checkboxes
    id: owner_decision
    attributes:
      label: Project owner decision
      options:
        - label: Accept Sprint 0 and authorize Sprint 1 planning.
        - label: Defer acceptance; list the remaining evidence needed.
